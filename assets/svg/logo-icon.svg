<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23262F"/>
      <stop offset="50%" stop-color="#181B22"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Main Metallic Gold/Cyan Cake Gradient -->
    <linearGradient id="primaryGrad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Gold Flame Gradient -->
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Ribbon Accent -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Subtle Radial Inner Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Cake Base Tier -->
  <path d="M128 352 C128 340 138 330 150 330 H362 C374 330 384 340 384 352 V390 C384 406 370 420 354 420 H158 C142 420 128 406 128 390 V352 Z" fill="url(#primaryGrad)" />
  
  <!-- Frosting Drips on Base Tier -->
  <path d="M128 350 C145 366 160 366 175 350 C190 366 205 366 220 350 C235 366 250 366 265 350 C280 366 295 366 310 350 C325 366 340 366 355 350 C370 366 384 350 384 350 V330 H128 V350 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- Cake Top Tier -->
  <path d="M168 256 C168 246 176 238 186 238 H326 C336 238 344 246 344 256 V314 C344 322 338 330 330 330 H182 C174 330 168 322 168 314 V256 Z" fill="url(#primaryGrad)" opacity="0.9" />

  <!-- Gold Decorative Ribbon -->
  <rect x="168" y="280" width="176" height="14" fill="url(#goldGrad)" rx="3" opacity="0.9" />

  <!-- Candles (3 Candles) -->
  <!-- Left Candle -->
  <rect x="204" y="174" width="16" height="64" rx="8" fill="#FFFFFF" opacity="0.9" />
  <path d="M212 142 C206 156 202 166 212 174 C222 166 218 156 212 142 Z" fill="url(#flameGrad)" filter="url(#glow)" />

  <!-- Center Candle (Taller Crown Candle) -->
  <rect x="248" y="154" width="16" height="84" rx="8" fill="#FFFFFF" />
  <path d="M256 118 C248 134 244 146 256 154 C268 146 264 134 256 118 Z" fill="url(#flameGrad)" filter="url(#glow)" />

  <!-- Right Candle -->
  <rect x="292" y="174" width="16" height="64" rx="8" fill="#FFFFFF" opacity="0.9" />
  <path d="M300 142 C294 156 290 166 300 174 C310 166 306 156 300 142 Z" fill="url(#flameGrad)" filter="url(#glow)" />

  <!-- Floating Magic Sparkle Stars -->
  <!-- Top Left Sparkle -->
  <path d="M120 160 Q120 180 100 180 Q120 180 120 200 Q120 180 140 180 Q120 180 120 160 Z" fill="#38BDF8" filter="url(#glow)" />
  
  <!-- Top Right Crown Sparkle -->
  <path d="M380 130 Q380 155 355 155 Q380 155 380 180 Q380 155 405 155 Q380 155 380 130 Z" fill="#FBBF24" filter="url(#glow)" />

  <!-- Small Ambient Sparkles -->
  <circle cx="140" cy="110" r="6" fill="#F472B6" />
  <circle cx="360" cy="220" r="5" fill="#38BDF8" />
  <circle cx="390" cy="320" r="7" fill="#A78BFA" />
  <circle cx="110" cy="300" r="5" fill="#FBBF24" />
</svg>
