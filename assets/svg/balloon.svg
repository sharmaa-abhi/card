<svg width="60" height="80" viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="balloonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Balloon Shape -->
  <path d="M30 4 C15 4 5 16 5 32 C5 48 24 56 28 58 L26 62 H34 L32 58 C36 56 55 48 55 32 C55 16 45 4 30 4 Z" fill="url(#balloonGrad)" filter="url(#balloonGlow)"/>
  <!-- Highlight -->
  <ellipse cx="20" cy="20" rx="4" ry="8" transform="rotate(-30 20 20)" fill="white" opacity="0.35"/>
  <!-- Ribbon String -->
  <path d="M30 62 C26 68, 34 72, 30 80" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
