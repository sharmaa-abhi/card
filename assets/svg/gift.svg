<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="giftBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Gift Box Body -->
  <rect x="8" y="24" width="48" height="34" rx="6" fill="url(#giftBoxGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Gift Box Lid -->
  <rect x="5" y="16" width="54" height="10" rx="3" fill="#8B5CF6" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Vertical Ribbon -->
  <rect x="28" y="16" width="8" height="42" fill="url(#ribbonGrad)"/>
  <!-- Horizontal Ribbon -->
  <rect x="8" y="37" width="48" height="8" fill="url(#ribbonGrad)"/>

  <!-- Ribbon Bow -->
  <path d="M32 16 C25 8, 16 12, 26 16 Z" fill="url(#ribbonGrad)"/>
  <path d="M32 16 C39 8, 48 12, 38 16 Z" fill="url(#ribbonGrad)"/>
  <circle cx="32" cy="16" r="3" fill="#FFFFFF"/>
</svg>
